spring:
  datasource:
    url: jdbc:h2:mem:atlas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

app:
  rate-limit:
    max-requests: 1000
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test-secret-test-secret-test-secret-0123
