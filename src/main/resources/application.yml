spring:
  application:
    name: atlas-cinesiterapia-backend
  profiles:
    default: dev
  datasource:
    # Neon: jdbc:postgresql://<host>/<db>?sslmode=require (ver README)
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${DB_USER:atlas}
    password: ${DB_PASSWORD:atlas}
    hikari:
      # Pool pequeno: el plan free de Neon limita conexiones y suspende por inactividad.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 120000
      max-lifetime: 600000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}

app:
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    reset-ttl: ${RESET_TTL:30m}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
