# Perfil de produccion: sin valores por defecto inseguros; todo viene del entorno.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        sslmode: require

app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    frontend-url: ${FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  media:
    proveedor: ${MEDIA_PROVIDER:r2}
    r2:
      endpoint: ${R2_ENDPOINT}
      access-key: ${R2_ACCESS_KEY_ID}
      secret-key: ${R2_SECRET_ACCESS_KEY}
      bucket: ${R2_BUCKET}

logging:
  level:
    root: INFO

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

server:
  # Detras del proxy de Render: toma la IP real del cliente de X-Forwarded-For.
  forward-headers-strategy: native
