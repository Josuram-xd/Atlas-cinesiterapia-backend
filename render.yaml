# Blueprint de Render para el backend. Los valores marcados con `sync: false`
# NO van aqui: se completan en el panel de Render (Environment) al crear el servicio.
services:
  - type: web
    name: atlas-cinesiterapia-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRINGDOC_ENABLED
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      # Neon: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
