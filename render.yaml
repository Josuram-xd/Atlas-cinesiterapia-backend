# Blueprint de Render para el backend. Los valores marcados con `sync: false`
# NO van aqui: se completan en el panel de Render (Environment) al crear el servicio.
services:
  - type: web
    name: atlas-cinesiterapia-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRINGDOC_ENABLED
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      # Neon: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Render genera un secreto aleatorio al crear el servicio.
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://atlas-cinesiterapia.vercel.app
      - key: FRONTEND_URL
        value: https://atlas-cinesiterapia.vercel.app
      # Multimedia en Cloudflare R2. Las llaves salen de un token de R2 (Object Read & Write sobre el bucket).
      - key: MEDIA_PROVIDER
        value: r2
      - key: R2_ENDPOINT
        value: https://8ed5dbebdf58fc54c8ca5e3860948df2.r2.cloudflarestorage.com
      - key: R2_BUCKET
        value: atlas-multimedia
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
